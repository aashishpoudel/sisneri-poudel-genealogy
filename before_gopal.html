<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        :root{
            --bg: #f7f9fb;
            --card: #ffffff;
            --text: #1f2a37;
            --muted: #6b7280;
            --primary: #0d6efd;
            --ring: #1abc9c;
            --line: #e5eef4;
            --shadow: 0 10px 30px rgba(0,0,0,.06);
            --radius: 16px;
            --radius-sm: 12px;
        }
        @media (prefers-color-scheme: dark){
            :root{
                --bg: #0b1320;
                --card: #0f1a2b;
                --text: #e5eef7;
                --muted: #99a3b2;
                --primary: #7ab8ff;
                --ring: #34d399;
                --line: #1f2a37;
                --shadow: 0 10px 30px rgba(0,0,0,.35);
            }
        }
        
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        
        .header-wrap {
            max-width: 100%;
            margin: 0;
            padding: 16px 20px;
        }
        
        .crumbs {
            display: inline-block;
            margin: 0;
            padding: 0;
        }
        
        .crumbs a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            transition: color .2s ease;
        }
        
        .crumbs a:hover {
            text-decoration: underline;
            color: var(--text);
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin: 6px 0 0;
            letter-spacing: .2px;
        }
        
        #container {
            margin-top: 80px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fef8e7 0%, #fffbf0 100%);
            color: #3d3d3d;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto;
            background: linear-gradient(135deg, #fef8e7 0%, #fffbf0 100%);
        }
        
        svg {
            display: block;
            margin: auto;
        }
        
        .link {
            fill: none;
            stroke: rgba(180, 140, 80, 0.4);
            stroke-width: 4px;
        }
        
        .node {
            cursor: pointer;
        }
        
        .node-group {
            transition: all 0.3s ease;
        }
        
        .node-rect {
            rx: 8;
            ry: 8;
            stroke-width: 2.5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
            transition: all 0.3s ease;
        }
        
        .node.male .node-rect {
            fill: #e8f4f8;
            stroke: #7fb3d5;
        }
        
        .node.female .node-rect {
            fill: #fce8f3;
            stroke: #e8a8c8;
        }
        
        .node.unknown .node-rect {
            fill: #f5f5f5;
            stroke: #c0c0c0;
        }
        
        .node.on-direct-line .node-rect {
            fill: #fff8dc !important;
            stroke: #d4af37 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6)) !important;
        }
        
        .node:hover .node-rect {
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            stroke-width: 3px;
        }
        
        .node-text {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
            fill: #3d3d3d;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        .node-date {
            font-size: 12px;
            text-anchor: middle;
            fill: #6b6b6b;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
        
        .node-circle {
            fill: #d4af37;
            stroke: #d4af37;
            stroke-width: 2;
        }
        
        .node-circle-text {
            font-size: 30px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            fill: white;
            pointer-events: none;
        }
        
        .tooltip {
            position: fixed;
            background: rgba(255, 248, 220, 0.98);
            color: #3d3d3d;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #d4af37;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            max-width: 300px;
            display: none;
        }
        
        .tooltip.visible {
            display: block;
        }
        
        .tooltip-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #8b6914;
        }
        
        .tooltip-line {
            margin: 3px 0;
            line-height: 1.3;
        }
        
        .controls {
            position: fixed;
            top: 100px;
            right: 20px;
            background: rgba(255, 248, 220, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .control-btn {
            background: #d4af37;
            color: #3d3d3d;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: #e8c547;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(212, 175, 55, 0.4);
        }
        
        .legend {
            position: fixed;
            top: 190px;
            right: 20px;
            background: rgba(255, 248, 220, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            font-size: 12px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .legend-item {
            margin: 6px 0;
            display: flex;
            align-items: center;
        }
        
        .legend-box {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            border-radius: 2px;
            border: 1.5px solid #999;
        }
        
        .male { background: #e8f4f8; }
        .female { background: #fce8f3; }
        .direct-line { background: #fff8dc; border: 2px solid #d4af37 !important; }
    </style>
</head>

        // Helper function to wrap text - more aggressive wrapping
        function wrapText(text, maxChars = 12) {
            if (text.length <= maxChars) return [text];
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            for (let word of words) {
                if ((currentLine + word).length <= maxChars) {
                    currentLine += (currentLine ? ' ' : '') + word;
                } else {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;

                    const y1 = d.target.y + yOffset;
                    
                    // Orthogonal path: vertical down, then horizontal

                    return `M${x0},${y0}L${x0},${midY}L${x1},${midY}L${x1},${y1}`;

                    const circleNum = lineNumbers[d.data.id];
                    const circleX = -125;  // Position further left to add space
                    const circleY = 0;     // Vertically centered
                    const circleRadius = 28;  // 20% bigger (was 23)
                    
                    d3.select(this).append('circle')
                        .attr('class', 'node-circle')
                        .attr('cx', circleX)
                        .attr('cy', circleY)
                        .attr('r', circleRadius);
                    
                    d3.select(this).append('text')
                        .attr('class', 'node-circle-text')
                        .attr('x', circleX)
                        .attr('y', circleY)
                        .text(circleNum);
                }
            });
            
            // Add text group container for proper vertical centering
            const textGroups = nodeGroups.append('g')
                .attr('class', 'text-container');
            
            // Add name text (given name) with wrapping - centered
            textGroups.append('text')
                .attr('class', 'node-text')
                .attr('x', 0)
                .attr('y', 0)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .each(function(d) {
                    const name = d.data.given_name || '(unknown)';
                    const lines = wrapText(name, 16);
                    d3.select(this)
                        .selectAll('tspan')
                        .remove();
                    const lineHeight = 1.1;
                    const totalHeight = (lines.length - 1) * lineHeight * 13 / 2;
                    lines.forEach((line, i) => {
                        d3.select(this).append('tspan')
                            .attr('x', 0)
                            .attr('dy', i === 0 ? -totalHeight : lineHeight + 'em')
                            .text(line);
                    });
                });
            
            // Add surname text (if present) - centered
            textGroups.append('text')
                .attr('class', 'node-text')
                .attr('x', 0)
                .attr('y', 12)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .each(function(d) {
                    const surname = d.data.surname || '';
                    if (!surname) {
                        d3.select(this).text('');
                        return;
                    }
                    const lines = wrapText(surname, 16);
                    d3.select(this)
                        .selectAll('tspan')
                        .remove();
                    const lineHeight = 1.1;
                    const totalHeight = (lines.length - 1) * lineHeight * 13 / 2;
                    lines.forEach((line, i) => {
                        d3.select(this).append('tspan')
                            .attr('x', 0)
                            .attr('dy', i === 0 ? -totalHeight : lineHeight + 'em')
                            .text(line);
                    });
                });
            
            // Add year text - at bottom, centered
            textGroups.append('text')
                .attr('class', 'node-date')
                .attr('x', 0)
                .attr('y', 32)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .text(d => {
                    let dateStr = '';
                    if (d.data.birth) {
                        const year = d.data.birth.split(' ').pop();
                        dateStr += year;
                    }
                    if (d.data.death) {
                        const year = d.data.death.split(' ').pop();
                        dateStr += ' - ' + year;
                    }
                    return dateStr;
                });
        });
        
        // Update SVG height based on content
        const bbox = g.node().getBBox();
        svgHeight = bbox.height + margin.top + margin.bottom + 100;
        svg.attr('height', svgHeight);
        
        // Zoom behavior
        const zoom = d3.zoom()
            .on('zoom', (e) => {
                g.attr('transform', e.transform);
            });
        
        svg.call(zoom);
        
        function fitView() {
            const bbox = g.node().getBBox();
            const fullWidth = window.innerWidth;
            const fullHeight = window.innerHeight;
            
            const scale = 0.9 / Math.max(
                bbox.width / fullWidth,
                bbox.height / fullHeight
            );
            
            const translate = [
                (fullWidth - bbox.width * scale) / 2 - bbox.x * scale,
                (fullHeight - bbox.height * scale) / 2 - bbox.y * scale
            ];
            
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
            );
        }
        
        // Initial fit
        setTimeout(fitView, 200);
    </script>
</body>
</html>
