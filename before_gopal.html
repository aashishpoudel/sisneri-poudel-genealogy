<title>Ancestral Tree (Before Gopal)</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #fafafa;
}

.node {
    text-align: center;
    position: relative;
    margin: 30px auto;
}

.person-box {
    display: inline-block;
    padding: 8px 14px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #fff;
    font-weight: 600;
}

.children {
    position: relative;
    margin-top: 20px;
}

/* Row of siblings */
.children-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    position: relative;
    padding-top: 20px;
}

/* Horizontal line ONLY across children span */
.children-row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: #333;
}

/* Individual child container */
.child {
    position: relative;
}

/* Vertical line DOWN from horizontal bar to child */
.child::before {
    content: "";
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 20px;
    background: #333;
}


.child::before {
    content: "";
    position: absolute;
    width: 2px;
    height: 20px;
    background: #333;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
}
</style>

</head>
