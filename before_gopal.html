<title>Poudel Lineage (Before Gopal)</title>
<style>
body {
    font-family: system-ui, sans-serif;
    background: #fafafa;
}

.person-block {
    text-align: center;
    margin: 30px auto;
    position: relative;
}

.person-card {
    display: inline-block;
    padding: 8px 14px;
    border: 2px solid #333;
    border-radius: 8px;
    background: white;
    font-size: 16px;
    position: relative;
    z-index: 2;
}

/* vertical line from parent down */
.person-block > .person-card::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 20px;
    background: #333;
    left: 50%;
    bottom: -20px;
    transform: translateX(-50%);
}

/* wrapper holds the horizontal connector */
.children-wrapper {
    position: relative;
    margin-top: 20px;
}


/* row of siblings */
.children-row {
    display: inline-flex;
    justify-content: center;
    position: relative;
    padding-top: 20px;
}

.children-inner {
    display: flex;
    gap: 40px;
    position: relative;
}

.children-line {
    position: absolute;
    top: 0;
    left: 20px;     /* half gap */
    right: 20px;    /* half gap */
    height: 2px;
    background: red;   /* keep red for now */
}





/* vertical line from sibling bar down to child */
.child-subtree::before {
    content: "";
    position: absolute;
    width: 2px;
    height: 20px;
    background: #333;
    top: 0;            /* start at horizontal line */
}

</style>
</head>
