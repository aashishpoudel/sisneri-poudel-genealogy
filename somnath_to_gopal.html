<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>

    <style>
        :root{
            --bg: #f7f9fb;
            --card: #ffffff;
            --text: #1f2a37;
            --muted: #6b7280;
            --primary: #0d6efd;
            --ring: #1abc9c;
            --line: #e5eef4;
            --shadow: 0 10px 30px rgba(0,0,0,.06);
            --radius: 16px;
            --radius-sm: 12px;
            --header-height: 90px;
            --tabs-height: 58px;
            --control-top: 125px;
            --control-width: 112px;
        }
        @media (prefers-color-scheme: dark){
            :root{
                --bg: #0b1320;
                --card: #0f1a2b;
                --text: #e5eef7;
                --muted: #99a3b2;
                --primary: #7ab8ff;
                --ring: #34d399;
                --line: #1f2a37;
                --shadow: 0 10px 30px rgba(0,0,0,.35);
            }
        }
        
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        
        .header-wrap {
            max-width: 100%;
            margin: 0;
            padding: 16px 20px;
        }
        
        .crumbs {
            display: inline-block;
            margin: 0;
            padding: 0;
        }
        
        .crumbs a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            transition: color .2s ease;
        }
        
        .crumbs a:hover {
            text-decoration: underline;
            color: var(--text);
        }
        
        .header-title {
            font-weight: 500;
            color: var(--text);
            margin: 6px 0 0;
            letter-spacing: .2px;
            line-height: 1.2;
            text-align: center;
        }
        
        .title-nepali {
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }

        .gen-dot-inline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 2px solid currentColor;
            border-radius: 9999px;
            font: 700 16px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: #1abc9c;
            background: currentColor;
            vertical-align: middle;
            margin: 0 .18em;
            user-select: none;
        }

        .gen-dot-inline span {
            color: #fff;
        }

        .title-english-inline {
            white-space: nowrap;
        }
        
        .language-tabs {
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            z-index: 998;
            display: flex;
            background: #2c3e50;
            border-bottom: 2px solid #34495e;
        }
        
        .lang-tab {
            flex: 1;
            padding: 10px;
            color: #fff;
            text-align: center;
            cursor: pointer;
            background: #34495e;
            border: none;
            font-size: 30px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            line-height: 1;
        }
        
        .lang-tab:hover {
            background: #4a606f;
        }
        
        .lang-tab.active {
            background: #1abc9c;
            font-weight: bold;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fef8e7 0%, #fffbf0 100%);
            color: #3d3d3d;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            width: 100%;
            height: calc(100vh - var(--header-height) - var(--tabs-height));
            margin-top: calc(var(--header-height) + var(--tabs-height));
            position: relative;
            overflow: auto;
            background: linear-gradient(135deg, #fef8e7 0%, #fffbf0 100%);
        }
        
        svg {
            display: block;
            margin: auto;
        }
        
        .link {
            fill: none;
            stroke: rgba(180, 140, 80, 0.4);
            stroke-width: 4px;
        }
        
        .node {
            cursor: pointer;
        }
        
        .node-group {
            transition: all 0.3s ease;
        }
        
        .node-rect {
            rx: 8;
            ry: 8;
            stroke-width: 2.5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
            transition: all 0.3s ease;
        }
        
        .node.male .node-rect {
            fill: #e8f4f8;
            stroke: #7fb3d5;
        }
        
        .node.female .node-rect {
            fill: #fce8f3;
            stroke: #e8a8c8;
        }
        
        .node.unknown .node-rect {
            fill: #f5f5f5;
            stroke: #c0c0c0;
        }
        
        .node.on-direct-line .node-rect {
            fill: #fff8dc !important;
            stroke: #d4af37 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6)) !important;
        }
        
        .node:hover .node-rect {
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            stroke-width: 3px;
        }
        
        .node-text {
            font-size: 21px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
            fill: #3d3d3d;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        .node-name.nepali-text {
            font-size: 36px;
        }
        
        .node-date {
            font-size: 12px;
            text-anchor: middle;
            fill: #6b6b6b;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
        
        .node-circle {
            fill: #d4af37;
            stroke: #d4af37;
            stroke-width: 2;
        }
        
        .node-circle-text {
            font-size: 30px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            fill: white;
            pointer-events: none;
        }
        
        .tooltip {
            position: fixed;
            background: rgba(255, 248, 220, 0.98);
            color: #3d3d3d;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #d4af37;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            max-width: 300px;
            display: none;
        }
        
        .tooltip.visible {
            display: block;
        }
        
        .tooltip-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #8b6914;
        }
        
        .tooltip-line {
            margin: 3px 0;
            line-height: 1.3;
        }
        
        .controls {
            position: fixed;
            top: var(--control-top);
            right: 20px;
            width: var(--control-width);
            background: #d4af37;
            padding: 0;
            border-radius: 4px;
            border: 2px solid #d4af37;
            z-index: 997;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .control-btn {
            background: #d4af37;
            color: #3d3d3d;
            border: none;
            width: 100%;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: #e8c547;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(212, 175, 55, 0.4);
        }
    </style>

    <script>
        let currentLanguage = 'nepali';  // Default language is Nepali

        function updateLayoutChrome() {
            const header = document.querySelector('.page-header');
            const tabs = document.querySelector('.language-tabs');
            const headerHeight = header ? Math.ceil(header.getBoundingClientRect().height) : 90;
            const tabsHeight = tabs ? Math.ceil(tabs.getBoundingClientRect().height) : 58;
            document.documentElement.style.setProperty('--header-height', `${headerHeight}px`);
            document.documentElement.style.setProperty('--tabs-height', `${tabsHeight}px`);
            document.documentElement.style.setProperty('--control-top', `${headerHeight + tabsHeight + 14}px`);
            return { headerHeight, tabsHeight };
        }
        
        function switchLanguage(lang) {
            currentLanguage = lang;
            updateLayoutChrome();
            
            // Update tab active state
            document.querySelectorAll('.lang-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update all node text based on language
            document.querySelectorAll('.node-group').forEach(nodeGroup => {
                const personId = nodeGroup.getAttribute('data-personId');
                const person = findPersonInTrees(personId);
                const nameElement = nodeGroup.querySelector('.node-name');
                
                if (person && nameElement) {
                    if (currentLanguage === 'nepali' && person.nepali_name) {
                        // For Nepali, display the nepali_name with larger font
                        const nepaliLines = wrapText(person.nepali_name, 16);
                        updateTspans(nameElement, nepaliLines);
                        nameElement.classList.add('nepali-text');
                    } else {
                        // For English, display given name with normal font
                        const englishLines = wrapText(person.given_name || person.name, 16);
                        updateTspans(nameElement, englishLines);
                        nameElement.classList.remove('nepali-text');
                    }
                }
            });
        }
        
        function updateTspans(textElement, lines) {
            if (!textElement) return;
            
            // Remove all existing tspans
            textElement.querySelectorAll('tspan').forEach(tspan => tspan.remove());
            
            // Add new tspans with updated text
            const lineHeight = 1.1;
            const totalHeight = (lines.length - 1) * lineHeight * 13 / 2;
            
            lines.forEach((line, i) => {
                const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tspan.setAttribute('x', '0');
                tspan.setAttribute('dy', i === 0 ? -totalHeight : lineHeight + 'em');
                tspan.textContent = line;
                textElement.appendChild(tspan);
            });
        }
        
        function findPersonInTrees(personId) {
            function searchNode(node) {
                if (node.id === personId) return node;
                for (let child of node.children) {
                    const result = searchNode(child);
                    if (result) return result;
                }
                return null;
            }
            for (let tree of treesData) {
                const result = searchNode(tree);
                if (result) return result;
            }
            return null;
        }

                        ? d.data.nepali_name 
                        : (d.data.given_name || '(unknown)');
                    
                    const lines = wrapText(displayName, 16);
                    d3.select(this)
                        .selectAll('tspan')
                        .remove();
                    const lineHeight = 1.1;
                    const totalHeight = (lines.length - 1) * lineHeight * 13 / 2;
                    lines.forEach((line, i) => {
                        d3.select(this).append('tspan')
                            .attr('x', 0)
                            .attr('dy', i === 0 ? -totalHeight : lineHeight + 'em')
                            .text(line);
                    });
                });
            
            // Add surname text (only for English, hidden by default)
            textGroups.append('text')
                .attr('class', 'node-text node-surname')
                .attr('x', 0)
                .attr('y', 12)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .each(function(d) {
                    const surname = d.data.surname || '';
                    if (!surname) {
                        d3.select(this).text('');
                        return;
                    }
                    const lines = wrapText(surname, 16);
                    d3.select(this)
                        .selectAll('tspan')
                        .remove();
                    const lineHeight = 1.1;
                    const totalHeight = (lines.length - 1) * lineHeight * 13 / 2;
                    lines.forEach((line, i) => {
                        d3.select(this).append('tspan')
                            .attr('x', 0)
                            .attr('dy', i === 0 ? -totalHeight : lineHeight + 'em')
                            .text(line);
                    });
                });
            
            // Add year text - at bottom, centered
            textGroups.append('text')
                .attr('class', 'node-date')
                .attr('x', 0)
                .attr('y', 32)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .text(d => {
                    let dateStr = '';
                    if (d.data.birth) {
                        const year = d.data.birth.split(' ').pop();
                        dateStr += year;
                    }
                    if (d.data.death) {
                        const year = d.data.death.split(' ').pop();
                        dateStr += ' - ' + year;
                    }
                    return dateStr;
                });
        });
        
        // Update SVG height based on content
        const bbox = g.node().getBBox();
        svgHeight = bbox.height + margin.top + margin.bottom + 100;
        svg.attr('height', svgHeight);
        
        // Zoom behavior
        const zoom = d3.zoom()
            .on('zoom', (e) => {
                g.attr('transform', e.transform);
            });
        
        svg.call(zoom);
        
        function fitView() {
            const chrome = updateLayoutChrome();
            const bbox = g.node().getBBox();
            const fullWidth = window.innerWidth;
            const fullHeight = Math.max(
                320,
                window.innerHeight - chrome.headerHeight - chrome.tabsHeight
            );
            
            const scale = 0.9 / Math.max(
                bbox.width / fullWidth,
                bbox.height / fullHeight
            );
            
            const translate = [
                (fullWidth - bbox.width * scale) / 2 - bbox.x * scale,
                (fullHeight - bbox.height * scale) / 2 - bbox.y * scale
            ];
            
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
            );
        }

        window.addEventListener('resize', () => {
            updateLayoutChrome();
        });
        
        // Initial fit
        setTimeout(fitView, 200);
    </script>
</body>
</html>
